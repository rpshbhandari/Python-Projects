{% extends 'core/base.html' %}

{% block title %}Profile{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="text-center mb-4">My Profile</h2>

                    <div class="row">
                        <div class="col-md-4 text-center">
                            <img src="{{ profile.profile_picture.url if profile.profile_picture else '/static/default-avatar.png' }}" class="img-fluid rounded-circle mb-3" width="150" alt="Profile Picture">
                        </div>
                        <div class="col-md-8">
                            <h4>{{ user.first_name }} {{ user.last_name }}</h4>
                            <p class="text-muted">{{ user.email }}</p>
                            <p>{{ profile.bio }}</p>

                            <a href="{% url 'home:edit_profile' %}" class="btn btn-primary">Edit Profile</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
