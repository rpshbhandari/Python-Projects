{% extends 'layout.html' %}


{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<article>
    <h2>{{ post.title }}</h2>
    <p><small>Published on {{ post.created_at|date:"Y-m-d H:i" }}</small></p>
    <div>
        {{ post.content }}
    </div>
</article>

<!-- Go to Top Button -->
<a href="#top" style="position: fixed; bottom: 20px; right: 20px; text-decoration: none;">
    Go to Top
</a>

<p><a href="{% url 'home' %}">Back to Home</a></p>
{% endblock %}
